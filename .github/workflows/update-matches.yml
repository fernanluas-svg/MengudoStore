name: Atualizar Agenda de Jogos


on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v3

      - name: Configurar Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          npm ci

      - name: Executar Script de Atualização da Agenda
        run: python scripts/updater.py

      - name: Executar Scraper de Odds
        run: python scripts/odds_scraper.py

      - name: Validar JSON gerado
        run: |
          for f in src/data/nextMatch.json src/data/matches.json src/data/libertadores.json src/data/odds.json src/data/copaDoBrasil.json src/data/carioca.json; do
            python -c "import json,sys; json.load(open('$f', encoding='utf-8'))" || exit 1
          done

      - name: Validar build (npm run build)
        run: npm run build

      - name: Fazer Commit e Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/nextMatch.json src/data/matches.json src/data/libertadores.json src/data/odds.json src/data/copaDoBrasil.json src/data/carioca.json src/data/classificacaoBrasileirao.json src/data/classificacaoLibertadores.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Atualiza agenda e odds via Python" && git push)
